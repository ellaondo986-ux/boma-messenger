name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

env:
  # install Android SDK into a runner-local directory to avoid permission issues
  ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '11'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Restore cache for buildozer & pip
      uses: actions/cache@v4
      with:
        # cache pip and buildozer artifacts
        path: |
          ~/.cache/pip
          .buildozer
        key: ${{ runner.os }}-buildozer-${{ hashFiles('**/requirements.txt','**/buildozer.spec') }}-v1
        restore-keys: |
          ${{ runner.os }}-buildozer-

    - name: Install system deps
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip autoconf libtool pkg-config \
          zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
          libffi-dev libssl-dev libjpeg-dev libfreetype6-dev

    - name: Install Android SDK command-line tools and platforms
      env:
        ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
      run: |
        mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
        cd "$ANDROID_SDK_ROOT"
        curl -fsSL -o cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip"
        unzip -q cmdline-tools.zip -d cmdline-tools
        # Move to a stable path expected by sdkmanager
        mkdir -p cmdline-tools/latest
        mv cmdline-tools/cmdline-tools/* cmdline-tools/latest/ || true
        export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH
        yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses || true
        sdkmanager --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-31" "build-tools;31.0.0" "ndk;23.1.7779620"

    - name: Set up pip and Buildozer
      run: |
        python -m pip install --upgrade "pip==23.1.2"
        pip install --upgrade cython==0.29.33 buildozer

    - name: Clean build directories
      run: rm -rf .buildozer bin

    - name: Build APK with Buildozer
      env:
        ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
        ANDROIDSDK_HOME: ${{ env.ANDROID_SDK_ROOT }}
      run: |
        buildozer -v android debug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
